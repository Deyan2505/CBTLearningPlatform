name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: CbtLearningPlatform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: CbtLearningPlatform/global.json

      - name: Restore
        run: dotnet restore CbtLearningPlatform.sln

      - name: Build
        run: dotnet build CbtLearningPlatform.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CbtLearningPlatform.sln --configuration Release --no-build --no-restore

  deploy:
    name: Deploy to Netlify
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: CbtLearningPlatform

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: CbtLearningPlatform/global.json

      - name: Publish standalone WASM client
        run: dotnet publish CbtLearningPlatform.Client/CbtLearningPlatform.Client.csproj --configuration Release --output publish

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: CbtLearningPlatform/publish/wwwroot
          production-deploy: true
          deploy-message: "Deploy from ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

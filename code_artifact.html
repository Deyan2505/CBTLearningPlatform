        const callGeminiAPI = async (prompt, systemInstruction = "") => {
            const apiKey = ""; // API key is provided automatically in execution runtime
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }]
            };
            if (systemInstruction) {
                payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            }

            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (err) {
                    if (i === 4) throw err;
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }

                                        <div className="pt-4 border-t border-slate-700 flex space-x-2">
                                            <input 
                                                type="text" 
                                                value={newStep}
                                                onChange={e => setNewStep(e.target.value)}
                                                placeholder="Въведете ръчно следващата стъпка или ползвайте бутона за Gemini..." 
                                                className="flex-1 bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-xs text-white outline-none focus:border-indigo-500"
                                            />
                                            <button 
                                                onClick={handleAddDownwardStep}
                                                className="bg-slate-700 hover:bg-slate-600 text-white font-bold px-4 py-2 rounded-lg text-xs"
                                            >
                                                + Ръчно Добавяне
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 6. CLINICAL PROTOCOL TAB */}
                        {activeTab === 'protocol' && (
                            <div className="space-y-8 animate-fadeIn">
                                <div className="border-b border-slate-700 pb-4">
                                    <h2 className="text-3xl font-extrabold text-white academic-font">Психотерапевтичен Протокол & Структура на Сесията</h2>
                                    <p className="text-slate-400 text-sm mt-1">Стандартизираната структура на КПТ сесия по Джудит Бек (Basics and Beyond).</p>
                                </div>

                                {/* 10 PRINCIPLES OF CBT */}
                                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                                    <h3 className="text-xl font-bold text-sky-400">10-те Фундаментални Принципа на КПТ (Beck, 2011)</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs text-slate-300">
                                        <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-700"><strong>1. Непрекъсната когнитивна концептуализация:</strong> Формулиране на случая в когнитивни термини.</div>
                                        <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-700"><strong>2. Здрава терапевтична алианса:</strong> Емпатия, автентичност и когнитивно сътрудничество.</div>
                                        <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-700"><strong>3. Активно сътрудничество:</strong> Терапевтът и клиентът са равен научен екип.</div>
                                        <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-700"><strong>4. Целево ориентирана и проблемно фокусирана:</strong> Определяне на ясни терапевтични цели.</div>
                                        <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-700"><strong>5. Първоначален фокус върху настоящето:</strong> Работа с тук-и-сега проблеми.</div>
                                        <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-700"><strong>6. Едукативна форма:</strong> Наставляване на клиента да стане "собствен терапевт".</div>
                                        <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-700"><strong>7. Ограничена във времето:</strong> Обичайно от 12 до 20 сесии при стандартни разстройства.</div>
                                        <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-700"><strong>8. Структурирани сесии:</strong> Спазване на ясен дневен ред за максимална ефективност.</div>
                                        <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-700"><strong>9. Обучаване в идентифициране & оспорване:</strong> Замяна на дисфункционални мисли.</div>
                                        <div className="bg-slate-900 p-3.5 rounded-xl border border-slate-700"><strong>10. Разнообразие от техники:</strong> Когнитивни, поведенчески и преживелищни интервенции.</div>
                                    </div>
                                </div>

                                {/* SESSION TIMELINE STRUCTURE */}
                                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                                    <h3 className="text-xl font-bold text-indigo-400">Структура на Стандартна КПТ Сесия (45–50 минути)</h3>
                                    <div className="space-y-3 text-xs">
                                        <div className="bg-slate-900 p-4 rounded-xl border-l-4 border-sky-500 flex justify-between items-center">
                                            <div>
                                                <strong className="text-sky-300 text-sm block">1. Начална част (5-10 мин.)</strong>
                                                <span className="text-slate-300">Проверка на настроението (BDI/BAI), преглед на изминалата седмица, преглед на домашното задание, определяне на дневния ред (Agenda Setting).</span>
                                            </div>
                                            <span className="font-mono text-slate-400">00:00 - 10:00</span>
                                        </div>

                                        <div className="bg-slate-900 p-4 rounded-xl border-l-4 border-indigo-500 flex justify-between items-center">
                                            <div>
                                                <strong className="text-indigo-300 text-sm block">2. Средна част (30-35 мин.)</strong>
                                                <span className="text-slate-300">Работа по конкретните точки от дневния ред, прилагане на Сократов диалог, поведенчески експерименти, когнитивно преструктуриране.</span>
                                            </div>
                                            <span className="font-mono text-slate-400">10:00 - 40:00</span>
                                        </div>

                                        <div className="bg-slate-900 p-4 rounded-xl border-l-4 border-emerald-500 flex justify-between items-center">
                                            <div>
                                                <strong className="text-emerald-300 text-sm block">3. Финална част (5-10 мин.)</strong>
                                                <span className="text-slate-300">Задаване на ново домашно задание, обобщение от страна на пациента ("Какво си вземате от днешната сесия?") и обратна връзка (Feedback).</span>
                                            </div>
                                            <span className="font-mono text-slate-400">40:00 - 50:00</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 7. CASE STUDIES TAB */}
                        {activeTab === 'cases' && (
                            <div className="space-y-8 animate-fadeIn">
                                <div className="border-b border-slate-700 pb-4">
                                    <h2 className="text-3xl font-extrabold text-white academic-font">Интерактивни Клинични Казуси</h2>
                                    <p className="text-slate-400 text-sm mt-1">Анализ на реални клинични случаи и вземане на терапевтични решения.</p>
                                </div>

                                <div className="space-y-6">
                                    {CASE_STUDIES.map(c => (
                                        <div key={c.id} className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                                            <h3 className="text-xl font-bold text-sky-400">{c.title}</h3>
                                            <p className="text-xs text-slate-300 leading-relaxed bg-slate-900 p-3 rounded-lg">{c.patient}</p>
                                            
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                                                <div className="bg-slate-900 p-3 rounded-lg">
                                                    <strong className="text-slate-400 block mb-1">Ситуация:</strong>
                                                    <span className="text-white">{c.situation}</span>
                                                </div>
                                                <div className="bg-slate-900 p-3 rounded-lg">
                                                    <strong className="text-slate-400 block mb-1">Автоматична мисъл:</strong>
                                                    <span className="text-amber-300 italic">{c.thought}</span>
                                                </div>
                                                <div className="bg-slate-900 p-3 rounded-lg">
                                                    <strong className="text-slate-400 block mb-1">Емоционален интензитет:</strong>
                                                    <span className="text-rose-400">{c.emotion}</span>
                                                </div>
                                            </div>

                                            <div className="bg-slate-900/90 p-4 rounded-xl border border-slate-700 space-y-3">
                                                <span className="text-xs font-bold text-sky-400 block">{c.socraticStep}</span>
                                                <div className="space-y-2">
                                                    {c.options.map((opt, oIdx) => (
                                                        <button 
                                                            key={oIdx}
                                                            onClick={() => alert(oIdx === c.correctOption ? 'Правилен избор! Това спазва принципа на Сократовия емпиризъм.' : 'Неправилно. Опитайте отново с по-съвместен КПТ подход.')}
                                                            className="w-full text-left bg-slate-800 hover:bg-slate-700 p-3 rounded-lg text-xs text-slate-200 border border-slate-700 transition-all"
                                                        >
                                                            {opt}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 8. AI CLINICAL SUPERVISOR TAB (GEMINI FEATURE 3) */}
                        {activeTab === 'aisupervisor' && (
                            <div className="space-y-6 animate-fadeIn">
                                <div className="border-b border-slate-700 pb-4 flex items-center justify-between">
                                    <div>
                                        <h2 className="text-3xl font-extrabold text-white academic-font flex items-center space-x-2">
                                            <span>✨ AI Клиничен КПТ Супервизор</span>
                                        </h2>
                                        <p className="text-slate-400 text-sm mt-1">Интерактивен диалог с изкуствен интелект (Gemini), специализиран в метода на Бек.</p>
                                    </div>
                                    <span className="text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/30 font-bold">
                                        Gemini 2.5 Flash
                                    </span>
                                </div>

                                {/* Chat Window */}
                                <div className="bg-slate-800 rounded-2xl border border-slate-700 shadow-xl overflow-hidden flex flex-col h-[550px]">
                                    <div className="bg-slate-900 px-6 py-4 border-b border-slate-700 flex items-center justify-between">
                                        <div className="flex items-center space-x-3">
                                            <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white text-xs font-bold">
                                                <i className="fa-solid fa-robot"></i>
                                            </div>
                                            <div>
                                                <h4 className="text-sm font-bold text-white">Д-р Бек AI (Супервизор)</h4>
                                                <span className="text-[10px] text-emerald-400 font-medium">● Активен консултант</span>
                                            </div>
                                        </div>
                                        <div className="text-xs text-slate-400">
                                            Задайте въпрос за клиника, техника или формулиране на казус
                                        </div>
                                    </div>

                                    {/* Messages list */}
                                    <div className="flex-1 p-6 overflow-y-auto space-y-4 custom-scrollbar bg-slate-900/40">
                                        {chatMessages.map((msg, idx) => (
                                            <div key={idx} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                <div className={`max-w-[80%] rounded-2xl px-4 py-3 text-xs leading-relaxed ${
                                                    msg.sender === 'user' 
                                                        ? 'bg-sky-600 text-white rounded-br-none' 
                                                        : 'bg-slate-800 text-slate-200 border border-slate-700 rounded-bl-none whitespace-pre-line'
                                                }`}>
                                                    {msg.text}
                                                </div>
                                            </div>
                                        ))}
                                        {isChatLoading && (
                                            <div className="flex justify-start">
                                                <div className="bg-slate-800 border border-slate-700 text-sky-400 rounded-2xl rounded-bl-none px-4 py-3 text-xs flex items-center space-x-2">
                                                    <i className="fa-solid fa-spinner animate-spin"></i>
                                                    <span>Супервизорът обмисля отговора...</span>
                                                </div>
                                            </div>
                                        )}
                                        <div ref={chatEndRef} />
                                    </div>

                                    {/* Input bar */}
                                    <div className="p-4 bg-slate-900 border-t border-slate-700 flex space-x-2">
                                        <input 
                                            type="text" 
                                            value={chatInput}
                                            onChange={e => setChatInput(e.target.value)}
                                            onKeyDown={e => e.key === 'Enter' && handleSendChatMessage()}
                                            placeholder="Въведете вашия въпрос (напр.: 'Как да формулирам Сократов въпрос при депресия?')..."
                                            className="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white outline-none focus:border-sky-500"
                                        />
                                        <button 
                                            onClick={handleSendChatMessage}
                                            disabled={isChatLoading}
                                            className="bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold px-6 py-3 rounded-xl text-xs transition-all shadow-md flex items-center space-x-1"
                                        >
                                            <span>✨ Изпрати</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 9. EXAM TAB */}
                        {activeTab === 'exam' && (
                            <div className="space-y-8 animate-fadeIn">
                                <div className="border-b border-slate-700 pb-4">
                                    <h2 className="text-3xl font-extrabold text-white academic-font">Изпит & Проверка на Знанията по КПТ</h2>
                                    <p className="text-slate-400 text-sm mt-1">Тестов модул за студентска самооценка с детайлни разяснения.</p>
                                </div>

                                <div className="space-y-6">
                                    {EXAM_QUESTIONS.map((q, idx) => (
                                        <div key={idx} className="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                                            <h3 className="font-bold text-white text-base leading-snug">{q.q}</h3>
                                            <div className="space-y-2">
                                                {q.options.map((opt, oIdx) => (
                                                    <label 
                                                        key={oIdx} 
                                                        className={`flex items-center space-x-3 p-3 rounded-xl border text-xs cursor-pointer transition-all ${
                                                            examAnswers[idx] === oIdx 
                                                                ? 'bg-sky-500/20 border-sky-500 text-white font-semibold' 
                                                                : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-750'
                                                        }`}
                                                    >
                                                        <input 
                                                            type="radio" 
                                                            name={`q_${idx}`} 
                                                            checked={examAnswers[idx] === oIdx} 
                                                            onChange={() => setExamAnswers({...examAnswers, [idx]: oIdx})}
                                                            className="accent-sky-500"
                                                        />
                                                        <span>{opt}</span>
                                                    </label>
                                                ))}
                                            </div>

                                            {examSubmitted && (
                                                <div className={`p-4 rounded-xl text-xs space-y-1 ${
                                                    examAnswers[idx] === q.correct 
                                                        ? 'bg-emerald-950/80 border border-emerald-500/50 text-emerald-200' 
                                                        : 'bg-rose-950/80 border border-rose-500/50 text-rose-200'
                                                }`}>
                                                    <strong className="block text-sm font-bold">
                                                        {examAnswers[idx] === q.correct ? '✓ Правилен отговор!' : '✗ Верен отговор: ' + q.options[q.correct]}
                                                    </strong>
                                                    <p>{q.exp}</p>
                                                </div>
                                            )}
                                        </div>
                                    ))}

                                    <div className="pt-4 flex items-center justify-between">
                                        <button 
                                            onClick={() => setExamSubmitted(true)}
                                            className="bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold px-8 py-3 rounded-xl text-sm shadow-lg"
                                        >
                                            Предай Изпита & Виж Резултата
                                        </button>

                                        {examSubmitted && (
                                            <div className="text-right">
                                                <span className="text-xs text-slate-400 block">Вашият краен резултат:</span>
                                                <span className="text-2xl font-extrabold text-sky-400">{calculateExamScore()} / {EXAM_QUESTIONS.length} точки</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 10. GLOSSARY TAB */}
                        {activeTab === 'glossary' && (
                            <div className="space-y-8 animate-fadeIn">
                                <div className="border-b border-slate-700 pb-4">
                                    <h2 className="text-3xl font-extrabold text-white academic-font">Пълен КПТ Глосарий (Английски - Български)</h2>
                                    <p className="text-slate-400 text-sm mt-1">Фундаментални понятийна терминология на когнитивно-поведенческата терапия.</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {GLOSSARY_DATA.map((item, idx) => (
                                        <div key={idx} className="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-2">
                                            <div className="flex justify-between items-start">
                                                <h3 className="font-bold text-sky-300 text-sm">{item.term}</h3>
                                                <span className="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-mono">{item.bg}</span>
                                            </div>
                                            <p className="text-xs text-slate-300 leading-relaxed">{item.def}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </main>

                    {/* ФУТЪР */}
                    <footer className="bg-slate-950 border-t border-slate-800 py-8 text-center text-xs text-slate-500 space-y-2">
                        <p>© 2026 КПТ Академия — Академичен Обучителен Портал с Gemini AI Интеграция.</p>
                        <p>Базирано на изследванията на Aaron T. Beck, MD & Judith S. Beck, PhD (Beck Institute for CBT).</p>
                    </footer>
                </div>
            );
        }

        // РЕНДЕРИРАНЕ НА АПЛИКАЦИЯТА
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
